status:
  scope: >-
    Formalized and compared: the three statements of the registered record,
    in comparator order, over S w = (w.map s).flatten for the Padovan rule s
    on Fin 3; "u is a factor of w" is u <:+: w (List.IsInfix).
    (1) padovan_a_forces_b: for all n, x, i, if
    (S^[n+1] [x])[i]? = some 0 then (S^[n+1] [x])[i+1]? = some 1.
    (2) padovan_chirality: for all n, x, [2, 0] is a factor of S^[5] [0]
    and [0, 2] is not a factor of S^[n] [x]. (3)
    padovan_no_long_palindrome: if u is a factor of S^[n] [x] and
    4 ≤ u.length then u is not a palindrome. All three are at the
    iterate-factor level: they quantify over factors of the words
    S^[n] [x], not over an abstract subshift or tiling space. Proved in
    the repository, not compared (Supplement.lean, namespace
    ArithmeticOfTime, with the definitions mir σ x = (σ x).reverse,
    inc σ i j = count of i in σ j as an integer matrix, sub σ w =
    (w.map σ).flatten and the row-major tensor tens):
    padovan_minimal_unique, padovan_eigenvalue_unique,
    padovan_matrix_unique, pisot_ge_plastic and padovan_rules_chiral (the
    compared statements of PALOMAR-2026-10-18-000019, same statements over
    the same definitions s, mir, inc, sub);
    padovan_exact_orientation_threshold_four with its two halves
    padovan_length_three_orientation_ambiguity and
    padovan_reversal_forbidden_of_four_le; iterate_mir_seed,
    iterate_tens_mir, single_mirrors_reverse (mirror identities for
    arbitrary substitutions and their row-major tensors);
    rate_eq_half_log (ρ · normSq σ = 1 gives −log ‖σ‖ = (1/2) log ρ);
    rhoQ_substitution_charpoly and rhoQ_chirality (the integer
    characteristic polynomial and a chirality witness pair of the
    twelve-letter tensor of the Padovan and quartic substitutions); and
    Time.beta_irrational (BetaIrrational.lean), the irrationality of
    β = log ‖w‖ / ((1/2) log ρ) for a non-real root w of x⁴ − x − 1. Not
    formalized: Siegel's theorem in degree above 3; Lind's general
    product construction; primitivity of the Padovan or twelve-letter
    substitution; any subshift-, tiling-space- or reversor-level
    statement; any spectral or diffraction-theoretic consequence (the
    diffraction/ folder is computation). No compared statement is a
    physical claim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

