# Version 2 of the repository registered as PALOMAR-2026-08-19-000006. The
# registered record stays pinned to revision
# c48eb12817dd1d7ff3dc4d92306c7a4f249e6d7d and compares three theorems.
# Version 2 is new commits to the same repository, not a registry
# submission; its compared surface (comparator.json, Challenge.lean,
# Solution.lean) is those three statements over s and S, unchanged, on
# Lean 4.35.0-rc2 / Mathlib 065356127b1d with module-system headers.
version: "v0.4"

project:
  name: "The Arithmetic of Time: chirality of the Padovan substitution"
  description: >-
    A kernel-checked chirality package for the Padovan substitution
    (0 ↦ 1, 1 ↦ 2, 2 ↦ 01 on Fin 3; its incidence matrix has characteristic
    polynomial x³ − x − 1, an orientation fact that is not used or compared).
    Three compared theorems, all at the iterate-factor level — they quantify
    over factors of the concrete words S^[n] [x], never over an abstract
    subshift. (1) The successor invariant: in every positive iterate from any
    seed, the letter 0 ("a") is immediately followed by 1 ("b").
    (2) Chirality: the word 20 ("ca") is a factor of an iterate while its
    reversal 02 ("ac") is a factor of no iterate from any seed — the factor
    language reads differently backwards — proved from the invariant, with no
    enumeration on the ac side. (3) No palindromic factor: no factor of
    length ≥ 4 of any iterate from any seed (including the zeroth iterate) is
    a palindrome, via a complete length-≤5 window certificate for the seed a
    together with the index shift S [0] = [1], S [1] = [2], which exhibits
    every seed's iterate as a seed-a iterate. These are the three compared
    statements of the registered record (PALOMAR-2026-08-19-000006 at
    revision c48eb12), unchanged in this revision. The uniqueness results
    proved in this repository (Supplement.lean: padovan_minimal_unique,
    padovan_eigenvalue_unique, padovan_matrix_unique, pisot_ge_plastic,
    padovan_rules_chiral) are registered separately as
    PALOMAR-2026-10-18-000019 (stalex444/arithmetic-of-time-slowest-clock,
    revision 49eafbab4af8899b2a66469697bf74683a88ce87), which compares them
    over s, mir, inc and sub. Everything else in this repository is public
    and kernel-checked but not compared: among it the exact orientation
    threshold (padovan_exact_orientation_threshold_four), the irrationality
    of the distinguished slope (Time.beta_irrational), mirror identities for
    arbitrary substitutions, a rate identity, and the characteristic
    polynomial and chirality of a twelve-letter substitution for ρQ.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  # math.CO / math.DS / 68R15 / 37B10 as registered at c48eb12.
  # physics.hist-ph and 00A79 because the narrative (README, Scope) states
  # the physical application: that physical time is this arithmetic, stated
  # there as an identification, not as a theorem. No compared statement is a
  # physical claim. (math.NT and 11R06, added for the Pisot statements when
  # they were on this surface, are dropped with them; those statements are
  # compared in PALOMAR-2026-10-18-000019.)
  arxiv: ["math.CO", "math.DS", "physics.hist-ph"]
  msc2020: ["68R15", "37B10", "00A79"]

sources:
  - title: "Algebraic integers whose conjugates lie in the unit circle"
    authors:
      - "Carl Ludwig Siegel"
    id: "Duke Mathematical Journal 11 (1944), 597-602"
    type: "article"
    location: "https://doi.org/10.1215/S0012-7094-44-01152-X"
    relationship: "independently-proves"
    note: >-
      Siegel proved that the real root ρ of x³ − x − 1 is the smallest
      Pisot number, in every degree. The module theorem pisot_ge_plastic
      (Supplement.lean, not compared here; compared in
      PALOMAR-2026-10-18-000019) is the restriction of that theorem to Pisot
      numbers of degree at most 3, proved by a different route: a Pisot
      number equals the Mahler measure of its minimal polynomial, and the
      registered minimal Mahler measures in degrees 2 and 3
      (PALOMAR-2026-08-31-000004) bound that measure below by the golden
      ratio and by ρ. The result is not new; only its kernel check is. The
      bound ρ ≤ θ of padovan_minimal_unique is this statement applied to an
      eigenvalue.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Rauzy Fractal of the Smallest Substitution Associated with the Smallest Pisot Number"
    authors:
      - "Paul Mercat"
    id: "Experimental Mathematics 29 (2020), 163-182"
    type: "article"
    location: "https://doi.org/10.1080/10586458.2018.1446063"
    relationship: "independently-proves"
    note: >-
      Mercat observed that, up to reversal and relabelling, there is a
      unique substitution with the fewest letters associated with the
      smallest Pisot number. The uniqueness half of the module theorems
      padovan_minimal_unique and padovan_eigenvalue_unique (Supplement.lean,
      not compared here; compared in PALOMAR-2026-10-18-000019) covers that
      observation for substitutions on at most three letters; it is proved
      independently, by classifying the 3 × 3 natural matrices with
      characteristic polynomial x³ − x − 1 (padovan_matrix_unique) and the
      substitutions with such a matrix, with no primitivity or unit
      hypothesis.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Entropies and factorizations of topological Markov shifts"
    authors:
      - "Douglas A. Lind"
    id: "Bulletin of the American Mathematical Society (N.S.) 9 (1983), 219-222"
    type: "article"
    location: "https://doi.org/10.1090/S0273-0979-1983-15162-5"
    relationship: "background"
    note: >-
      Theorem 2 relates direct-product factorizations of a Markov shift
      to factorizations of its spectral radius into Perron numbers.
      Background for a module theorem, not compared:
      rhoQ_substitution_charpoly (Supplement.lean) computes the integer
      characteristic polynomial of the row-major tensor of the Padovan and
      quartic substitutions, the minimal polynomial of ρQ; the tensor is
      the direct-product construction (cf. Lind, Theorem 2). The general
      product lemma is not claimed or formalized.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Dynamical Invariants from Asymptotic Composants"
    authors:
      - "Franz Gähler"
    id: "arXiv:2602.18501"
    type: "article"
    location: "https://arxiv.org/abs/2602.18501"
    relationship: "background"
    note: >-
      Gähler establishes the reflection asymmetry of plastic-number
      substitution tiling spaces computationally; the Padovan rule appears,
      up to letter renaming and reflection, as the class-7 representative in
      his Table 2. The entry here gives a kernel-checked factor-language
      counterpart of that asymmetry, by a different and enumeration-free
      method (the successor invariant), together with the palindrome-free
      window certificate.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Algebraic Combinatorics on Words"
    authors:
      - "M. Lothaire"
    id: "Cambridge University Press, 2002. ISBN 978-0521812207"
    type: "book"
    location: "https://doi.org/10.1017/CBO9781107326019"
    relationship: "background"
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Sturmian jungle (or garden?) on multiliteral alphabets"
    authors:
      - "Ľubomíra Balková"
      - "Edita Pelantová"
      - "Štěpán Starosta"
    id: "RAIRO Theoretical Informatics and Applications 44 (2010), 443-470"
    type: "article"
    location: "https://doi.org/10.1051/ita/2011002"
    relationship: "background"
    note: >-
      Context for compared statements 2 and 3 (and for the module
      theorems on the orientation threshold, the mirror rule and the
      twelve-letter substitution):
      substitution languages that are not closed under reversal are known
      (Example 5.3), and for uniformly recurrent words finitely many
      palindromes follows from non-closure under reversal (Theorem 3.2). What is claimed here is
      the kernel check and the explicit certificates, not the phenomenon.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Reversing and extended symmetries of shift spaces"
    authors:
      - "Michael Baake"
      - "John A. G. Roberts"
      - "Reem Yassawi"
    id: "Discrete and Continuous Dynamical Systems A 38 (2018), 835-866"
    type: "article"
    location: "https://doi.org/10.3934/dcds.2018036"
    relationship: "background"
    note: >-
      Published examples of substitution languages not closed under
      reversal (Example 2), and the distinction between language chirality
      and the existence of a reversor for the shift. The compared
      statements are about factor languages of iterates only; no
      reversor statement is made.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "A characterization of Sturmian sequences by indistinguishable asymptotic pairs"
    authors:
      - "Sebastián Barbieri"
      - "Sébastien Labbé"
      - "Štěpán Starosta"
    id: "European Journal of Combinatorics 95 (2021), 103318"
    type: "article"
    location: "https://doi.org/10.1016/j.ejc.2021.103318"
    relationship: "background"
    note: >-
      Context for the marked origin of the mechanical word
      (OriginDefect.lean, a module theorem, not compared): the two
      one-sided words at intercept zero form the distinguished asymptotic
      pair of a Sturmian system, characterized there for all irrational
      slopes. The module's statements are elementary and self-contained.
    license: "unknown"
    author_endorsement: "not-contacted"

