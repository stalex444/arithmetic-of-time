fidelity:
  divergences: >-
    (a) The compared statements are at the iterate-factor level (they
    quantify over factors of the concrete words S^[n] [x], not over an
    abstract subshift or tiling space), and every prose claim in this
    entry about them is stated at exactly that level. (b) Two definitions
    appear on the compared surface (s, S), each a one-line construction,
    identical in Challenge.lean and Solution.lean. (c) Module provenance:
    Challenge.lean, Solution.lean and the ten version-1 modules are
    identical to the registered revision c48eb12 apart from the
    module-system header, except Irreducibility's one proof repair in
    quartic_irred_zmod2 (statement unchanged); the five PdtMahler* modules
    have every statement and proof byte-identical to
    PALOMAR-2026-08-31-000004 at ca3df22 apart from the module header,
    and four of them carry docstring edits that remove internal
    cross-references; the other Pdt* modules carry docstring edits of the
    same kind, statements and proofs unchanged. (d) The module theorem
    pisot_ge_plastic is Siegel's theorem restricted to degree at most 3,
    proved through the registered minimal Mahler measures of
    PALOMAR-2026-08-31-000004 (a Pisot number equals the Mahler measure of
    its minimal polynomial, Time.Clock.mahler_eq_of_pisot), not by
    Siegel's argument; the result is classical. The twelve-letter
    characteristic polynomial is one instance of the direct-product
    construction (cf. Lind, Bull. AMS 9 (1983), Theorem 2); the general
    lemma is not claimed; the identification of the polynomial as the
    minimal polynomial of ρQ is proved in the repository
    (PdtRulerMinpoly), and primitivity is not proved. (e) The physical
    reading in the README's Scope section is an identification, stated
    there as one; it is not a theorem and no compared statement asserts
    it.

