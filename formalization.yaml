version: "v0.4"

project:
  name: "The Arithmetic of Time: chirality of the Padovan substitution"
  description: >-
    A kernel-checked chirality package for the Padovan substitution
    (0 ↦ 1, 1 ↦ 2, 2 ↦ 01 on Fin 3; its incidence matrix has characteristic
    polynomial x³ − x − 1, an orientation fact that is not used or compared).
    Three compared theorems, all at the iterate-factor level — they quantify
    over factors of the concrete words S^[n] [x], never over an abstract
    subshift. (1) The successor invariant: in every positive iterate from any
    seed, the letter 0 ("a") is immediately followed by 1 ("b").
    (2) Chirality: the word 20 ("ca") is a factor of an iterate while its
    reversal 02 ("ac") is a factor of no iterate from any seed — the factor
    language reads differently backwards — proved from the invariant, with no
    enumeration on the ac side. (3) No palindromic factor: no factor of
    length ≥ 4 of any iterate from any seed (including the zeroth iterate) is
    a palindrome, via a complete length-≤5 window certificate for the seed a
    together with the index shift S [0] = [1], S [1] = [2], which exhibits
    every seed's iterate as a seed-a iterate.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  arxiv: ["math.CO", "math.DS"]
  msc2020: ["68R15", "37B10"]

sources:
  - title: "Algebraic Combinatorics on Words"
    authors:
      - "M. Lothaire"
    id: "Cambridge University Press, 2002. ISBN 978-0521812207"
    type: "book"
    location: "https://doi.org/10.1017/CBO9781107326019"
    relationship: "background"
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Dynamical Invariants from Asymptotic Composants"
    authors:
      - "Franz Gähler"
    id: "arXiv:2602.18501"
    type: "article"
    location: "https://arxiv.org/abs/2602.18501"
    relationship: "adapts"
    note: >-
      Gähler establishes the reflection asymmetry of plastic-number
      substitution tiling spaces computationally; the Padovan rule appears,
      up to letter renaming and reflection, as the class-7 representative in
      his Table 2. The entry here gives a kernel-checked factor-language
      counterpart of that asymmetry, by a different and enumeration-free
      method (the successor invariant), together with the palindrome-free
      window certificate.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    Formalized: the Padovan chirality package on the Fin 3 alphabet — the
    a-forces-b successor invariant (every positive iterate, every seed), the
    ca/ac chirality (ca a factor of an iterate; ac a factor of no iterate
    from any seed), and palindrome-freeness for factors of length ≥ 4 (every
    seed, every iterate, including the zeroth). All compared statements are
    at the iterate-factor level: they quantify over factors of the words
    S^[n] [x], not over an abstract subshift or tiling space. Not formalized:
    tiling-space-level or subshift-level statements of the reflection
    asymmetry; primitivity of the substitution; any spectral or
    diffraction-theoretic consequence.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Anthropic Claude (Opus/Sonnet-class, 2026)"]
      framework: "Claude Code"
      tool_setup: >-
        AI-assisted proof drafting, refactoring, and error-loop iteration in
        Claude Code against lake build; a CI axiom audit
        (scripts/check_axioms.py, one #print axioms per declaration) runs on
        every push and fails on any axiom outside the standard three, any
        sorry, or any native_decide.
      cost:
        wall_time: "several weeks of part-time sessions across the development"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        Theorem-by-theorem sessions; statements fixed by the author first,
        proofs iterated against the compiler; an independent second
        formalization of the settling module (SettlingReplica) was produced
        as a replication check.
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: >-
        Author-directed statement design, mathematical review, and acceptance
        of every theorem; all statements audited by the author against their
        informal descriptions.
      cost:
        wall_time: "included in the sessions above"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: >-
    Human-directed, machine-verified workflow: the author fixes statements and
    reviews all mathematics; AI assistance drafts and repairs proofs; the Lean
    kernel is the acceptance criterion, enforced in CI with a per-declaration
    axiom audit.

fidelity:
  divergences: >-
    None known. The compared statements are at the iterate-factor level (they
    quantify over factors of the concrete words S^[n] [x], not over an
    abstract subshift or tiling space), and every prose claim in this entry
    is stated at exactly that level.

review:
  status: "self-assessed"
  reviewers:
    - "Stephanie Alexander"
  notes: >-
    Statements audited by the author against the informal claims; the settling
    module carries an independent second formalization in the same repository
    (SettlingReplica) as a replication check; CI reruns the full build and the
    per-declaration axiom audit on every push.

alignment:
  namespace: "ArithmeticOfTime"
  statements:
    - source: "This work; asymmetry reported computationally in Gähler arXiv:2602.18501"
      lean: "ArithmeticOfTime.padovan_a_forces_b"
      module: "Solution"
      status: "proved"
      note: "The invariant: in every positive iterate from any seed, 0 is immediately followed by 1."
    - source: "This work; asymmetry reported computationally in Gähler arXiv:2602.18501"
      lean: "ArithmeticOfTime.padovan_chirality"
      module: "Solution"
      status: "proved"
      note: "20 is a factor of an iterate; 02 is a factor of no iterate from any seed."
    - source: "This work"
      lean: "ArithmeticOfTime.padovan_no_long_palindrome"
      module: "Solution"
      status: "proved"
      note: >-
        No palindromic factor of length ≥ 4 in any iterate from any seed,
        via a complete length-≤5 window certificate at the seed a and the
        index shift reducing every seed to it.

